name: Unit tests (AMD rusticl)
run-name: ${{ inputs.math_tests && 'Math tests' || '' }}

# Builds chipStar (+ all tests) on the self-hosted rusticl runner (AMD Radeon Pro
# W6400, navi24/radeonsi/ACO) and verifies the GPU is visible to chipStar via
# hipInfo. This gates the rusticl-amdgpu work (PR #1285): program-scope device
# globals must stay gated OFF for rusticl, so the runtime is configured with
# -DCHIP_ENABLE_DEVICE_PROGRAM_SCOPE_GLOBALS=OFF.
#
# The runner is a container that bind-mounts the host GPU userspace at
# /space/pvelesko/install (rusticl + libdrm + oneAPI) and
# passes /dev/dri/renderD128. It carries ONLY the custom labels (no defaults).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: "docs/**"
  # No `push:` trigger: it would double-fire alongside `pull_request` for branches
  # with an open PR, producing duplicate runs that compete for the single
  # self-hosted runner. PRs are covered by `pull_request`; use the manual
  # dispatch for branches without a PR.
  workflow_dispatch:
    inputs:
      math_tests:
        description: Run only the hip-tests MathsTest cases
        type: boolean
        default: false

concurrency:
  group: rusticl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-hipinfo:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [rusticl]
    timeout-minutes: 120
    env:
      # LLVM 21 with chipStar's patches, installed by test-llvm-patches.yml.
      LLVM_PREFIX: /space/pvelesko/rusticl-ci-llvm/install/llvm/21.0
      # rusticl runtime: dedicated AMDGPU LLVM 22 + libdrm 2.4.134 + oneAPI + ocl-icd
      # loader (ahead of oneAPI's so OCL_ICD_VENDORS is honoured). Mirrors the
      # working host invocation / the container's /etc/profile.d/00-rusticl.sh.
      RUSTICL_ENABLE: radeonsi
      OCL_ICD_VENDORS: /home/runner/.rusticl-icd
      LD_LIBRARY_PATH: /space/pvelesko/install/ocl-icd-loder/lib:/space/pvelesko/install/llvm/22.0-native-amd/lib:/space/pvelesko/install/libdrm/2.4.134/lib/x86_64-linux-gnu:/space/pvelesko/install/oneapi/2025.3.2/lib:/space/pvelesko/install/oneapi/2025.3.2/lib64
      # chipStar OpenCL device selection: rusticl is the only ICD on this runner
      # (OCL_ICD_VENDORS is rusticl-only), so it is platform 0, device 0.
      CHIP_BE: opencl
      CHIP_PLATFORM: "0"
      CHIP_DEVICE: "0"
      # Build dir persists across jobs so ninja rebuilds only what changed.
      BUILD_ROOT: /home/runner/_work/ci-build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up LLVM 21 toolchain on PATH
        shell: bash
        run: echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"

      # ninja cannot see a rebuilt toolchain, a new file shadowing an included one, nor a
      # changed CMake default, which only seeds a fresh cache; any change wipes the build dir.
      - name: Reset build dir on configuration change
        shell: bash
        run: |
          set -eo pipefail
          STAMP=$(set -eo pipefail; { find -L $LLVM_PREFIX/bin $LLVM_PREFIX/lib -maxdepth 1 -type f -printf '%P %T@\n' | sort; cat .github/workflows/unit-tests-amd-rusticl.yml
            git ls-files --recurse-submodules | grep -vE '\.(c|cc|cpp|cxx|hip|cu|md|rst)$'
            git ls-files -z --recurse-submodules -- '*CMakeLists.txt' '*.cmake' | xargs -0 cat; } | sha256sum)
          [ "$(cat $BUILD_ROOT/stamp 2>/dev/null)" = "$STAMP" ] || rm -rf $BUILD_ROOT
          mkdir -p $BUILD_ROOT && echo "$STAMP" > $BUILD_ROOT/stamp
          rm -f $BUILD_ROOT/build/checkpy_*.txt $BUILD_ROOT/build/Testing/Temporary/LastTest.log

      - name: Show rusticl device (clinfo)
        shell: bash
        run: |
          echo "PATH toolchain: $LLVM_PREFIX"
          clang++ --version | head -1
          which llvm-spirv xxd
          clinfo -l

      - name: Build chipStar (program-scope globals OFF for rusticl)
        shell: bash
        run: |
          set -e
          B=$BUILD_ROOT/build
          cmake -S . -B $B -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DLLVM_CONFIG_BIN="$LLVM_PREFIX/bin/llvm-config" \
            -DCHIP_ENABLE_DEVICE_PROGRAM_SCOPE_GLOBALS=OFF \
            -DCHIP_ATOMICS_CACHE_BYPASS_WORKAROUND=ON \
            -DCMAKE_LINK_DEPENDS_NO_SHARED=ON
          ninja -C $B -j$(nproc)
          ninja -C $B -j$(nproc) build_tests

      - name: Verify rusticl AMD GPU via hipInfo
        shell: bash
        run: |
          set -e
          cd $BUILD_ROOT/build
          echo "=== hipInfo ==="
          ./hipInfo | tee hipinfo.out
          echo "=== assert an AMD Radeon device is present ==="
          if ! grep -qiE "Radeon|gfx10|navi" hipinfo.out; then
            echo "::error::hipInfo did not report an AMD Radeon device — rusticl GPU not visible to chipStar"
            exit 1
          fi
          echo "OK: chipStar sees the rusticl AMD GPU"

      - name: Run check.py test suite on rusticl
        shell: bash
        run: |
          set -e
          cd $BUILD_ROOT/build
          # 4 GB W6400: keep parallelism low to avoid VRAM contention flakiness.
          # check.py exits non-zero unless every test passes (no known-failure
          # exclusions for this backend), so this step gates on 100% pass.
          $GITHUB_WORKSPACE/scripts/check.py ./ dgpu opencl --num-threads 4 --timeout 180 ${{ inputs.math_tests && '--math-tests' || '' }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rusticl-check-logs
          path: |
            /home/runner/_work/ci-build/build/Testing/Temporary/LastTest.log
            /home/runner/_work/ci-build/build/checkpy_*.txt
          if-no-files-found: ignore

  math-tests-status:
    needs: build-and-hipinfo
    if: ${{ always() && inputs.math_tests }}
    permissions:
      actions: read
      statuses: write
    uses: ./.github/workflows/math-tests-status.yml
    with:
      result: ${{ needs.build-and-hipinfo.result }}
