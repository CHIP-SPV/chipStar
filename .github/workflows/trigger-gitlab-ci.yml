name: Trigger GitLab Aurora CI

# Fires when a PR comment contains /run-aurora-ci
#
# Requires these GitHub repository secrets:
#   GITLAB_URL           - e.g. https://git.cels.anl.gov
#   GITLAB_PROJECT_ID    - numeric project ID from GitLab project settings
#   GITLAB_TRIGGER_TOKEN - from GitLab project > Settings > CI/CD > Pipeline triggers

on:
  issue_comment:
    types: [created]

jobs:
  trigger-from-comment:
    name: Trigger from /run-aurora-ci comment
    # Only on PR comments (not plain issue comments) from trusted users
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request.url != '' &&
      contains(github.event.comment.body, '/run-aurora-ci') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER'
      )
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: write
      issues: write
    steps:
      - name: Get PR head SHA and ref
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('ref', pr.data.head.ref);

      # Clears any status left by an earlier run on this SHA, so a rerun does not
      # show the previous verdict while it is in flight.
      - name: Mark aurora-ci pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr-info.outputs.sha }}',
              state: 'pending',
              context: 'aurora-ci',
              description: 'pipeline queued on Aurora',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      # Every pipeline runs ref=main, so GitLab's own auto-cancel cannot tell two
      # PRs apart. GITHUB_PR_NUMBER is the only thing that identifies the PR, so
      # match on it here.
      - name: Cancel this PR's earlier pipelines
        continue-on-error: true
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: |
          if [ -z "${GITLAB_API_TOKEN}" ]; then
            echo "GITLAB_API_TOKEN not set; skipping supersede"
            exit 0
          fi
          api() { curl -sS --fail -H "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" "$@"; }
          base="${GITLAB_URL}/api/v4/projects/${GITLAB_PROJECT_ID}/pipelines"

          # Temporary: the listing 403s from this runner but not from ALCF or a
          # laptop. --fail hides the response body, and GitLab names the cause there.
          echo "debug: token length ${#GITLAB_API_TOKEN}, url ${GITLAB_URL}, project ${GITLAB_PROJECT_ID}"
          code=$(curl -sS -o /tmp/gl_body -w "%{http_code}" \
                 -H "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
                 "${base}?status=running&per_page=1")
          echo "debug: http ${code}"
          head -c 500 /tmp/gl_body; echo

          for status in running pending; do
            api "${base}?status=${status}&per_page=100" | jq -r '.[].id'
          done | sort -u | while read -r id; do
            pr=$(api "${base}/${id}/variables" \
                 | jq -r '.[] | select(.key=="GITHUB_PR_NUMBER") | .value')
            if [ "${pr}" = "${PR}" ]; then
              echo "cancelling pipeline ${id} (PR ${pr})"
              api -X POST "${base}/${id}/cancel" > /dev/null
            fi
          done

      - name: Trigger GitLab pipeline
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
        run: |
          curl -X POST --fail-with-body \
            "${GITLAB_URL}/api/v4/projects/${GITLAB_PROJECT_ID}/trigger/pipeline" \
            -F "token=${GITLAB_TRIGGER_TOKEN}" \
            -F "ref=main" \
            -F "variables[TRIGGER_SOURCE]=github_comment" \
            -F "variables[GITHUB_PR_NUMBER]=${{ github.event.issue.number }}" \
            -F "variables[GITHUB_SHA]=${{ steps.pr-info.outputs.sha }}" \
            -F "variables[GITHUB_REF]=${{ steps.pr-info.outputs.ref }}"

      - name: React with rocket on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Post failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: ':x: Failed to trigger GitLab Aurora CI pipeline. See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });
