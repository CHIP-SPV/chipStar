name: Unit tests (RISC-V PoCL)
run-name: ${{ inputs.math_tests && 'Math tests' || '' }}

# k3: SpacemiT K3 (8x X100 rv64gcv), OpenCL via a source-built PoCL on the CPU.
# Both SPIR-V producers come from the same LLVM 23 toolchain. Sequential lanes
# rather than a matrix: there is one runner.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: "docs/**"
  workflow_dispatch:
    inputs:
      math_tests:
        description: Run only the hip-tests MathsTest cases
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ !github.event.pull_request.draft }}
    name: chipStar unit tests (RISC-V, LLVM 23, native + translator)
    runs-on: [self-hosted, riscv64, k3]
    env:
      PATH: /home/bianbu/.local/bin:/usr/local/bin:/usr/bin:/bin
      LLVM_DIR: /home/bianbu/install/llvm-23
      POCL_DIR: /home/bianbu/install/pocl
      # Build dirs persist across jobs so ninja rebuilds only what changed.
      BUILD_ROOT: /home/bianbu/ci-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: 'recursive'

      # ninja cannot see a rebuilt toolchain, a new file shadowing an included one, nor a
      # changed CMake default, which only seeds a fresh cache; any change wipes both lanes.
      - name: Reset build dirs on configuration change
        run: |
          set -eo pipefail
          STAMP=$(set -eo pipefail; { find -L $LLVM_DIR/bin $LLVM_DIR/lib -maxdepth 1 -type f -printf '%P %T@\n' | sort; cat .github/workflows/unit-tests-riscv-pocl.yml
            git ls-files --recurse-submodules | grep -vE '\.(c|cc|cpp|cxx|hip|cu|md|rst)$'
            git ls-files -z --recurse-submodules -- '*CMakeLists.txt' '*.cmake' | xargs -0 cat; } | sha256sum)
          [ "$(cat $BUILD_ROOT/stamp 2>/dev/null)" = "$STAMP" ] || rm -rf $BUILD_ROOT
          mkdir -p $BUILD_ROOT && echo "$STAMP" > $BUILD_ROOT/stamp

      - name: Build chipStar (native SPIR-V backend)
        run: |
          set -e
          B=$BUILD_ROOT/native
          rm -f $B/checkpy_*.txt $B/Testing/Temporary/LastTest.log
          # Device code is compiled through the pass plugin and device library
          # --hip-path points at, which ccache does not see on the command line.
          export CCACHE_EXTRAFILES=$B/lib/libLLVMHipSpvPasses.so:$B/lib/hip-device-lib/hipspv-spirv64v1.3-unknown-chipstar.bc
          cmake -S . -B $B -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_LINK_DEPENDS_NO_SHARED=ON \
            -DCHIP_LLVM_USE_INTERGRATED_SPIRV=ON \
            -DCHIP_ATOMICS_CACHE_BYPASS_WORKAROUND=ON \
            -DLLVM_CONFIG_BIN=$LLVM_DIR/bin/llvm-config \
            -DOpenCL_LIBRARY=$POCL_DIR/lib/libOpenCL.so \
            -DOpenCL_INCLUDE_DIR=/home/bianbu/space/OpenCL-Headers
          ninja -C $B -j$(nproc)
          ninja -C $B -j$(nproc) build_tests
          ccache -s
        timeout-minutes: 150

      - name: Test native, pocl opencl
        run: cd $BUILD_ROOT/native && $GITHUB_WORKSPACE/scripts/check.py ./ pocl opencl ${{ inputs.math_tests && '--math-tests' || '' }}
        timeout-minutes: 90

      - name: Build chipStar (llvm-spirv translator)
        id: translator-build
        if: ${{ !cancelled() }}
        run: |
          set -e
          B=$BUILD_ROOT/translator
          rm -f $B/checkpy_*.txt $B/Testing/Temporary/LastTest.log
          # Device code is compiled through the pass plugin and device library
          # --hip-path points at, which ccache does not see on the command line.
          export CCACHE_EXTRAFILES=$B/lib/libLLVMHipSpvPasses.so:$B/lib/hip-device-lib/hipspv-spirv64v1.3-unknown-chipstar.bc
          cmake -S . -B $B -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_LINK_DEPENDS_NO_SHARED=ON \
            -DCHIP_LLVM_USE_INTERGRATED_SPIRV=OFF \
            -DCHIP_ATOMICS_CACHE_BYPASS_WORKAROUND=ON \
            -DLLVM_CONFIG_BIN=$LLVM_DIR/bin/llvm-config \
            -DOpenCL_LIBRARY=$POCL_DIR/lib/libOpenCL.so \
            -DOpenCL_INCLUDE_DIR=/home/bianbu/space/OpenCL-Headers
          ninja -C $B -j$(nproc)
          ninja -C $B -j$(nproc) build_tests
          ccache -s
        timeout-minutes: 150

      - name: Test translator, pocl opencl
        if: ${{ !cancelled() && steps.translator-build.outcome == 'success' }}
        run: cd $BUILD_ROOT/translator && $GITHUB_WORKSPACE/scripts/check.py ./ pocl opencl ${{ inputs.math_tests && '--math-tests' || '' }}
        timeout-minutes: 90

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-riscv-pocl
          path: |
            /home/bianbu/ci-build/*/checkpy_*.txt
            /home/bianbu/ci-build/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  math-tests-status:
    needs: build-and-test
    if: ${{ always() && inputs.math_tests }}
    permissions:
      actions: read
      statuses: write
    uses: ./.github/workflows/math-tests-status.yml
    with:
      result: ${{ needs.build-and-test.result }}
