name: Unit tests (x86 Intel GPU)
run-name: ${{ inputs.math_tests && 'Math tests' || '' }}

# chipStar's own HIP unit tests on Intel hardware: both SPIR-V producers,
# both device classes (integrated and discrete), both backends.
#
# Single job on purpose. The previous layout was six jobs handing a ~13 GB
# tree between them through /tmp/chipstar-ci-staging, which only worked
# because exactly one runner answered [self-hosted, Linux, X64]. GitHub
# cannot require that two jobs share a runner, so a second x86 machine broke
# every consumer of that tree. One job cannot be split across hosts.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: "docs/**"
  workflow_dispatch:
    inputs:
      math_tests:
        description: Run only the hip-tests MathsTest cases
        type: boolean
        default: false

concurrency:
  group: meatloaf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chipstar-unit-tests:
    if: ${{ !github.event.pull_request.draft }}
    name: chipStar unit tests (LLVM 23, native + translator)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: ${{ inputs.math_tests && 720 || 360 }}
    env:
      # Content-addressed kernel cache, persistent and shared across PRs: the
      # key covers module SPIR-V, driver option strings, linked rtdevlib
      # modules, device identity, the loader-delta digest of the libraries the
      # runtime loaded at init, and the compiler environment. A chipStar
      # change that alters device output therefore misses. Known gaps are in
      # the README's Module Cache section.
      #
      # Not under /tmp: this runner reboots and clears it.
      CHIP_MODULE_CACHE_DIR: /home/pvelesko/.cache/chipstar-ci
      # IGC software fp64 emulation: Arc A380 (Alchemist) has no native fp64.
      # Set for build and test alike, since kernels using doubles are compiled
      # at build time.
      IGC_EnableDPEmulation: "1"
      OverrideDefaultFP64Settings: "1"
      CHIP_LOGLEVEL: err
      POCL_KERNEL_CACHE: "0"
      # 10s under the 1800s test timeout so the runtime gives up first.
      CHIP_L0_EVENT_TIMEOUT: "1790"
      # Build dirs persist across jobs so ninja rebuilds only what changed.
      BUILD_ROOT: /home/pvelesko/ci-build
      # Outside the checkout, which actions/checkout cleans every job.
      CCACHE_DIR: /home/pvelesko/.cache/ccache-ci
      CCACHE_MAXSIZE: 20G
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: 'recursive'

      # ninja cannot see a rebuilt toolchain, a new file shadowing an included one, nor a
      # changed CMake default, which only seeds a fresh cache; any change wipes both lanes.
      - name: Reset build dirs on configuration change
        shell: bash
        run: |
          set -eo pipefail
          rm -f $BUILD_ROOT/*/checkpy_*.txt $BUILD_ROOT/*/Testing/Temporary/LastTest.log
          source scripts/module-env.sh
          module load oneapi/2025.0.4 llvm/23.0 level-zero/dgpu
          LLVM_DIR=$(llvm-config --prefix)
          STAMP=$(set -eo pipefail; { find -L $LLVM_DIR/bin $LLVM_DIR/lib -maxdepth 1 -type f -printf '%P %T@\n' | sort; cat .github/workflows/unit-tests-x86-intel.yml
            git ls-files --recurse-submodules | grep -vE '\.(c|cc|cpp|cxx|hip|cu|md|rst)$'
            git ls-files -z --recurse-submodules -- '*CMakeLists.txt' '*.cmake' | xargs -0 cat; } | sha256sum)
          [ "$(cat $BUILD_ROOT/stamp 2>/dev/null)" = "$STAMP" ] || rm -rf $BUILD_ROOT
          mkdir -p $BUILD_ROOT && echo "$STAMP" > $BUILD_ROOT/stamp

      - name: Sanity-check runner (page locking, OpenCL devices)
        shell: bash
        run: |
          set -e
          echo '#include <sys/mman.h>
          #include <stdlib.h>
          int main() { void *p = malloc(4096); return mlock(p, 4096); }' \
            | gcc -x c - -o /tmp/mlocktest && /tmp/mlocktest \
            && echo "Page locking works" || { echo "Page locking failed"; exit 1; }
          source scripts/module-env.sh
          module load oneapi/2025.0.4 opencl/dgpu
          clinfo -l | grep "Platform #0" || { echo "No OpenCL devices detected."; exit 1; }

      # =====================================================================
      # Lane 1: in-tree SPIR-V backend
      # =====================================================================
      - name: Build chipStar (native SPIR-V backend)
        id: native-build
        shell: bash
        run: |
          set -e
          source scripts/module-env.sh
          module load oneapi/2025.0.4 llvm/23.0 level-zero/dgpu
          B=$BUILD_ROOT/native
          # Device code is compiled through the pass plugin and device library
          # --hip-path points at, which ccache does not see on the command line.
          export CCACHE_EXTRAFILES=$B/lib/libLLVMHipSpvPasses.so:$B/lib/hip-device-lib/hipspv-spirv64v1.3-unknown-chipstar.bc
          cmake -S . -B $B -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_LINK_DEPENDS_NO_SHARED=ON \
            -DCHIP_LLVM_USE_INTERGRATED_SPIRV=ON \
            -DCHIP_ATOMICS_CACHE_BYPASS_WORKAROUND=ON \
            -DLLVM_CONFIG_BIN=$(which llvm-config)
          ninja -C $B -j8
          ninja -C $B -j8 build_tests
          ccache -s

      - name: Test native, igpu opencl
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && (success() || inputs.math_tests) }}
        shell: bash
        run: |
          set -e
          source scripts/module-env.sh
          module load oneapi/2025.0.4 llvm/23.0 opencl/igpu
          nt=$(cat /opt/actions-runner/num-threads.txt 2>/dev/null || nproc)
          cd $BUILD_ROOT/native && $GITHUB_WORKSPACE/scripts/check.py ./ igpu opencl --num-threads=$nt --timeout=1800 ${{ inputs.math_tests && '--math-tests' || '' }}

      - name: Test native, igpu level0
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && (success() || inputs.math_tests) }}
        shell: bash
        run: |
          set -e
          source scripts/module-env.sh
          module load oneapi/2025.0.4 llvm/23.0 level-zero/igpu
          nt=$(cat /opt/actions-runner/num-threads.txt 2>/dev/null || nproc)
          cd $BUILD_ROOT/native && $GITHUB_WORKSPACE/scripts/check.py ./ igpu level0 --num-threads=$nt --timeout=1800 ${{ inputs.math_tests && '--math-tests' || '' }}

      - name: Test native, dgpu opencl
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && (success() || inputs.math_tests) }}
        shell: bash
        run: |
          set -e
          source scripts/module-env.sh
          module load oneapi/2025.0.4 llvm/23.0 opencl/dgpu
          nt=$(cat /opt/actions-runner/num-threads.txt 2>/dev/null || nproc)
          cd $BUILD_ROOT/native && $GITHUB_WORKSPACE/scripts/check.py ./ dgpu opencl --num-threads=$nt --timeout=1800 ${{ inputs.math_tests && '--math-tests' || '' }}

      - name: Test native, dgpu level0
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && (success() || inputs.math_tests) }}
        shell: bash
        run: |
          set -e
          source scripts/module-env.sh
          module load oneapi/2025.0.4 llvm/23.0 level-zero/dgpu
          nt=$(cat /opt/actions-runner/num-threads.txt 2>/dev/null || nproc)
          cd $BUILD_ROOT/native && $GITHUB_WORKSPACE/scripts/check.py ./ dgpu level0 --num-threads=$nt --timeout=1800 ${{ inputs.math_tests && '--math-tests' || '' }}

      # =====================================================================
      # Lane 2: llvm-spirv translator
      #
      # One LLVM 23 toolchain serves both lanes: chipStar's patches landed in
      # llvm#213052, so the SPIRV-target build also drives the translator and
      # the producer is chosen per build by CHIP_LLVM_USE_INTERGRATED_SPIRV.
      # Each lane keeps its own build dir under BUILD_ROOT.
      # =====================================================================
      - name: Build chipStar (llvm-spirv translator)
        id: translator-build
        if: ${{ !cancelled() && (success() || inputs.math_tests) }}
        shell: bash
        run: |
          set -e
          source scripts/module-env.sh
          module load oneapi/2025.0.4 llvm/23.0 level-zero/dgpu
          B=$BUILD_ROOT/translator
          # Device code is compiled through the pass plugin and device library
          # --hip-path points at, which ccache does not see on the command line.
          export CCACHE_EXTRAFILES=$B/lib/libLLVMHipSpvPasses.so:$B/lib/hip-device-lib/hipspv-spirv64v1.3-unknown-chipstar.bc
          cmake -S . -B $B -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_LINK_DEPENDS_NO_SHARED=ON \
            -DCHIP_LLVM_USE_INTERGRATED_SPIRV=OFF \
            -DCHIP_ATOMICS_CACHE_BYPASS_WORKAROUND=ON \
            -DLLVM_CONFIG_BIN=$(which llvm-config)
          ninja -C $B -j8
          ninja -C $B -j8 build_tests
          ccache -s

      - name: Test translator, igpu opencl
        if: ${{ !cancelled() && steps.translator-build.outcome == 'success' && (success() || inputs.math_tests) }}
        shell: bash
        run: |
          set -e
          source scripts/module-env.sh
          module load oneapi/2025.0.4 llvm/23.0 opencl/igpu
          nt=$(cat /opt/actions-runner/num-threads.txt 2>/dev/null || nproc)
          cd $BUILD_ROOT/translator && $GITHUB_WORKSPACE/scripts/check.py ./ igpu opencl --num-threads=$nt --timeout=1800 ${{ inputs.math_tests && '--math-tests' || '' }}

      - name: Test translator, igpu level0
        if: ${{ !cancelled() && steps.translator-build.outcome == 'success' && (success() || inputs.math_tests) }}
        shell: bash
        run: |
          set -e
          source scripts/module-env.sh
          module load oneapi/2025.0.4 llvm/23.0 level-zero/igpu
          nt=$(cat /opt/actions-runner/num-threads.txt 2>/dev/null || nproc)
          cd $BUILD_ROOT/translator && $GITHUB_WORKSPACE/scripts/check.py ./ igpu level0 --num-threads=$nt --timeout=1800 ${{ inputs.math_tests && '--math-tests' || '' }}

      - name: Test translator, dgpu opencl
        if: ${{ !cancelled() && steps.translator-build.outcome == 'success' && (success() || inputs.math_tests) }}
        shell: bash
        run: |
          set -e
          source scripts/module-env.sh
          module load oneapi/2025.0.4 llvm/23.0 opencl/dgpu
          nt=$(cat /opt/actions-runner/num-threads.txt 2>/dev/null || nproc)
          cd $BUILD_ROOT/translator && $GITHUB_WORKSPACE/scripts/check.py ./ dgpu opencl --num-threads=$nt --timeout=1800 ${{ inputs.math_tests && '--math-tests' || '' }}

      - name: Test translator, dgpu level0
        if: ${{ !cancelled() && steps.translator-build.outcome == 'success' && (success() || inputs.math_tests) }}
        shell: bash
        run: |
          set -e
          source scripts/module-env.sh
          module load oneapi/2025.0.4 llvm/23.0 level-zero/dgpu
          nt=$(cat /opt/actions-runner/num-threads.txt 2>/dev/null || nproc)
          cd $BUILD_ROOT/translator && $GITHUB_WORKSPACE/scripts/check.py ./ dgpu level0 --num-threads=$nt --timeout=1800 ${{ inputs.math_tests && '--math-tests' || '' }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-x86
          path: |
            ${{ env.BUILD_ROOT }}/*/checkpy_*.txt
            ${{ env.BUILD_ROOT }}/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  math-tests-status:
    needs: chipstar-unit-tests
    if: ${{ always() && inputs.math_tests }}
    permissions:
      actions: read
      statuses: write
    uses: ./.github/workflows/math-tests-status.yml
    with:
      result: ${{ needs.chipstar-unit-tests.result }}
