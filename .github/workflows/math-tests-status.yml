name: Math tests status

# Posts the final /run-math-tests result of a unit-tests workflow as a commit
# status on the PR head, linked to the run.

on:
  workflow_call:
    inputs:
      result:
        required: true
        type: string

jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ inputs.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
            const { data: wf } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: run.workflow_id });
            const all = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: run.workflow_id,
              head_sha: run.head_sha,
              event: 'workflow_dispatch'
            });
            if (all.some(x => x.display_title === run.display_title && x.id > run.id)) {
              core.info('A newer math run owns the status; skipping.');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: run.head_sha,
              state: process.env.RESULT === 'success' ? 'success' : 'failure',
              context: `math-tests / ${wf.name}`,
              description: process.env.RESULT,
              target_url: run.html_url
            });
