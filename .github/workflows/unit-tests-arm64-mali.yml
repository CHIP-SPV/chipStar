name: Unit tests (ARM64 Mali)

# salami: ARM64 Linux with a Mali-G52 iGPU, OpenCL only (no Level Zero).
#
# salami builds chipStar in 61 minutes and runs the tests in 4, so the build
# happens on an x86 runner in a container and only the tests run on salami.
# Both SPIR-V producers are covered; each is a separate cross build.
#
# The two jobs share nothing on disk. The handoff is an rsync to
# salami:~/ci-stage/<sha>/, keyed by commit rather than PR number so two
# pushes to one PR in quick succession cannot overwrite each other's tree.
# See scripts/cross-aarch64/README.md for how the cross build works and
# which tests it deliberately leaves to the x86 gate.

on:
  pull_request:
    paths-ignore: "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-compile:
    name: cross-compile for salami (${{ matrix.variant }})
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: native
            integrated_spirv: "ON"
          - variant: translator
            integrated_spirv: "OFF"
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: 'recursive'

      - id: sha
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # The image carries an LLVM 23 build (~40 min) and is cached by
      # docker; this is a no-op after the first run on a given runner and
      # after any change to the image inputs.
      - name: Ensure cross image
        run: |
          set -euo pipefail
          W=/space/pvelesko/cross-chipstar-work
          [ -d /space ] || W=$HOME/cross-chipstar-work
          mkdir -p "$W"
          echo "CROSS_WORK=$W" >> "$GITHUB_ENV"
          if docker image inspect chipstar-cross-aarch64:llvm23 >/dev/null 2>&1; then
            echo "image present"; exit 0
          fi
          docker build -t chipstar-cross-aarch64:base scripts/cross-aarch64
          U="$(id -u):$(id -g)"
          docker run --rm --user "$U" -e HOME=/work -v "$PWD":/chipstar:ro -v "$W":/work \
            chipstar-cross-aarch64:base /chipstar/scripts/cross-aarch64/image-llvm.sh
          docker run --rm --user "$U" -e HOME=/work -v "$PWD/scripts/cross-aarch64":/s:ro -v "$W":/work \
            chipstar-cross-aarch64:base /s/image-spirv-tools.sh
          rm -rf "$W/image-ctx" && mkdir -p "$W/image-ctx/opt"
          cp -a "$W"/x86-stage/opt/* "$W"/spirv-stage/opt/* "$W/image-ctx/opt/"
          docker build -f scripts/cross-aarch64/Dockerfile.chipstar \
            -t chipstar-cross-aarch64:llvm23 "$W/image-ctx"
        timeout-minutes: 90

      - name: Cross-compile chipStar + tests (${{ matrix.variant }})
        run: |
          set -euo pipefail
          JOBS=$(nproc); JOBS=$(( JOBS > 1 ? JOBS - 1 : 1 ))
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/work \
            -e INTEGRATED_SPIRV=${{ matrix.integrated_spirv }} \
            -e STAGE_PREFIX=/home/pvelesko/ci-stage/${{ steps.sha.outputs.sha }}-${{ matrix.variant }} \
            -v "$PWD":/chipstar:ro -v "$CROSS_WORK":/work \
            chipstar-cross-aarch64:llvm23 \
            /chipstar/scripts/cross-aarch64/cross-chipstar.sh \
              ${{ steps.sha.outputs.sha }}-${{ matrix.variant }} "$JOBS"
        timeout-minutes: 30

      - name: Ship to salami
        run: |
          set -euo pipefail
          scripts/cross-aarch64/ship-to-salami.sh \
            "$CROSS_WORK/cross-${{ steps.sha.outputs.sha }}-${{ matrix.variant }}" \
            ${{ steps.sha.outputs.sha }}-${{ matrix.variant }}
        timeout-minutes: 15

  test-mali:
    name: run on Mali (${{ matrix.variant }})
    needs: cross-compile
    runs-on: [self-hosted, Linux, ARM64]
    strategy:
      fail-fast: false
      matrix:
        variant: [native, translator]
    env:
      CHIP_MODULE_CACHE_DIR: ""
      CHIP_LOGLEVEL: err
      POCL_KERNEL_CACHE: "0"
    steps:
      - name: Test igpu opencl (${{ matrix.variant }})
        run: |
          set -euo pipefail
          T=$HOME/ci-stage/${{ needs.cross-compile.outputs.sha }}-${{ matrix.variant }}
          [ -x "$T/hipInfo" ] || { echo "::error::no cross-built tree at $T"; exit 1; }
          cd "$T"
          rm -rf ~/.cache/chipStar
          nt=$(cat /opt/actions-runner/num-threads.txt 2>/dev/null || nproc)
          LD_LIBRARY_PATH=$PWD python3 src/scripts/check.py ./ igpu opencl --num-threads=$nt --timeout=1800
        timeout-minutes: 30

      # Reap stage trees older than a week so salami's disk does not fill.
      - name: Reap old stage trees
        if: always()
        run: find "$HOME/ci-stage" -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-salami-${{ matrix.variant }}
          path: |
            ~/ci-stage/${{ needs.cross-compile.outputs.sha }}-${{ matrix.variant }}/checkpy_*.txt
            ~/ci-stage/${{ needs.cross-compile.outputs.sha }}-${{ matrix.variant }}/Testing/**/LastTest.log
          if-no-files-found: ignore
