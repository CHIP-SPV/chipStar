name: Test LLVM Patches

on:
  # Only main: every job that runs on a push is gated on the main branch
  # (they install the built toolchains). Without this, pushing a PR branch
  # starts a second run that shares the concurrency group below with the
  # pull_request run and cancels it, and every job reports as failed.
  push:
    branches: [main]
    paths:
      - 'llvm-patches/**'
      - 'scripts/configure_llvm.sh'
      - 'scripts/cross-aarch64/**'
      - '.github/workflows/test-llvm-patches.yml'
  pull_request:
    paths:
      - 'llvm-patches/**'
      - 'scripts/configure_llvm.sh'
      - 'scripts/cross-aarch64/**'
      - '.github/workflows/test-llvm-patches.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Policy: test only the versions whose patch series changed; configure_llvm.sh
  # or workflow changes test everything (as does a manual dispatch). Each
  # toolchain rebuild costs hours of self-hosted runner time, so an
  # llvm-23-only change must not rebuild 21/22. Runs on GitHub-hosted ubuntu
  # so it never queues behind the self-hosted build runners.
  detect:
    name: Detect changed LLVM versions
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.diff.outputs.any }}
      run_21: ${{ steps.diff.outputs.run_21 }}
      run_22: ${{ steps.diff.outputs.run_22 }}
      run_23: ${{ steps.diff.outputs.run_23 }}
      matrix1: ${{ steps.diff.outputs.matrix1 }}
      matrix2: ${{ steps.diff.outputs.matrix2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE_SHA"
          else
            BASE=""   # workflow_dispatch: test everything
          fi
          # New branches push with an all-zero before-sha; an unknown base
          # object cannot be diffed either. Both mean: treat as all-changed.
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) BASE="" ;;
            *) git cat-file -e "$BASE" 2>/dev/null || BASE="" ;;
          esac
          if [ -z "$BASE" ] || ! git diff --quiet "$BASE"...HEAD -- scripts/configure_llvm.sh .github/workflows/test-llvm-patches.yml; then
            v21=true; v22=true; v23=true
          else
            v21=false; v22=false; v23=false
            git diff --quiet "$BASE"...HEAD -- llvm-patches/llvm-21 || v21=true
            git diff --quiet "$BASE"...HEAD -- llvm-patches/llvm-22 || v22=true
            git diff --quiet "$BASE"...HEAD -- llvm-patches/llvm-23 || v23=true
            # The aarch64 cross-build scripts only feed the LLVM 23 salami
            # lane, so a change there rebuilds 23 alone, not 21/22.
            git diff --quiet "$BASE"...HEAD -- scripts/cross-aarch64 || v23=true
          fi
          any=false
          { $v21 || $v22 || $v23; } && any=true
          echo "run_21=$v21" >> "$GITHUB_OUTPUT"
          echo "run_22=$v22" >> "$GITHUB_OUTPUT"
          echo "run_23=$v23" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          m1="["; m2="["
          $v21 && { m1="$m1{\"llvm-version\":21,\"build-id\":\"21\",\"install-suffix\":\"\",\"variant-flag\":\"\"},"; m2="$m2{\"llvm-version\":21,\"build-id\":\"21\",\"install-suffix\":\"\"},"; }
          $v22 && { m1="$m1{\"llvm-version\":22,\"build-id\":\"22-translator\",\"install-suffix\":\"-translator\",\"variant-flag\":\"--variant translator\"},{\"llvm-version\":22,\"build-id\":\"22-native\",\"install-suffix\":\"-native\",\"variant-flag\":\"--variant native\"},"; m2="$m2{\"llvm-version\":22,\"build-id\":\"22-translator\",\"install-suffix\":\"-translator\"},{\"llvm-version\":22,\"build-id\":\"22-native\",\"install-suffix\":\"-native\"},"; }
          $v23 && { m1="$m1{\"llvm-version\":23,\"build-id\":\"23\",\"install-suffix\":\"\",\"variant-flag\":\"--variant native\"},"; m2="$m2{\"llvm-version\":23,\"build-id\":\"23\",\"install-suffix\":\"\"},"; }
          m1="${m1%,}]"; m2="${m2%,}]"
          echo "matrix1=$m1" >> "$GITHUB_OUTPUT"
          echo "matrix2=$m2" >> "$GITHUB_OUTPUT"
          echo "changed: 21=$v21 22=$v22 23=$v23 (base: ${BASE:-<none, all versions>})"

  step1-configure-all:
    needs: detect
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && needs.detect.outputs.any == 'true'
    name: 'Step 1: Configure all LLVM versions and verify patches'
    runs-on:
      - self-hosted
      - Linux
      - X64
    strategy:
      # Matrix entries come from the detect job; only changed versions appear.
      # LLVM 23 needs only one build: chipStar patches in llvm#213052, so the
      # SPIRV-target build also serves the translator and the producer is
      # chosen per compilation by -f[no-]integrated-objemitter.
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix1) }}
      fail-fast: true
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: 'recursive'
      - name: Configure LLVM ${{ matrix.build-id }}
        run: |
          rm -rf $HOME/llvm-builds/${{ matrix.build-id }}
          mkdir -p $HOME/llvm-builds/${{ matrix.build-id }}
          cd $HOME/llvm-builds/${{ matrix.build-id }}
          rm -rf scripts llvm-patches
          cp -r ${{ github.workspace }}/scripts .
          cp -r ${{ github.workspace }}/llvm-patches .
          chmod +x scripts/configure_llvm.sh
          ./scripts/configure_llvm.sh --version ${{ matrix.llvm-version }} \
            --install-dir $HOME/install/llvm/${{ matrix.llvm-version }}.0${{ matrix.install-suffix }} \
            ${{ matrix.variant-flag }} --configure-only

  step2-build-test:
    needs: [detect, step1-configure-all]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && needs.detect.outputs.any == 'true'
    name: Build LLVM ${{ matrix.build-id }} and test chipStar
    runs-on:
      - self-hosted
      - Linux
      - X64
    env:
      IGC_EnableDPEmulation: 1
      OverrideDefaultFP64Settings: 1
      CHIP_LOGLEVEL: err
      CHIP_MODULE_CACHE_DIR: ""
      POCL_KERNEL_CACHE: 0
      CHIP_L0_EVENT_TIMEOUT: 1790
    strategy:
      # Matrix entries come from the detect job; only changed versions appear.
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix2) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: 'recursive'
      - name: Build LLVM ${{ matrix.build-id }}
        id: build_llvm
        run: |
          BUILD_DIR="$HOME/llvm-builds/${{ matrix.build-id }}/llvm-project/llvm/build_${{ matrix.llvm-version }}"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory $BUILD_DIR does not exist. Step 1 may have failed."
            exit 1
          fi
          cd "$BUILD_DIR"
          make -j$(nproc)
        timeout-minutes: 300
      - name: Stage install for later
        if: steps.build_llvm.outcome == 'success'
        run: |
          rm -rf $HOME/llvm-stage/${{ matrix.build-id }}
          DESTDIR=$HOME/llvm-stage/${{ matrix.build-id }} cmake --install $HOME/llvm-builds/${{ matrix.build-id }}/llvm-project/llvm/build_${{ matrix.llvm-version }}
      - name: Build chipStar with LLVM ${{ matrix.build-id }}
        id: build_chipstar
        if: steps.build_llvm.outcome == 'success'
        run: |
          # Source modules for device drivers
          if [ -f "$HOME/.local/init/bash" ]; then
            export MODULESHOME=$HOME/.local
            source "$MODULESHOME/init/bash"
          elif [ -f /etc/profile.d/lmod.sh ]; then
            source /etc/profile.d/lmod.sh &> /dev/null
          else
            source /etc/profile.d/modules.sh &> /dev/null
          fi
          module use ~/modulefiles
          module load oneapi/2025.0.4 opencl/dgpu

          # Build/test against the INSTALLED LLVM toolchain (staged above), not
          # the build tree. The build tree's clang resource dir lacks
          # install-only runtime headers such as omp.h, which made
          # TestHipccFopenmp fail with "'omp.h' file not found".
          LLVM_PREFIX="$HOME/install/llvm/${{ matrix.llvm-version }}.0${{ matrix.install-suffix }}"
          LLVM_STAGE="$HOME/llvm-stage/${{ matrix.build-id }}${LLVM_PREFIX}"
          LLVM_BIN="${LLVM_STAGE}/bin"
          test -f "${LLVM_BIN}/clang" || exit 1

          # The staged binaries are thin drivers; all the driver logic lives in
          # libclang-cpp.so / libLLVM.so. Their RUNPATH points at the *final*
          # install prefix ($HOME/install/llvm/<ver>), not at the stage, so by
          # default the staged clang loads the previously installed libraries
          # and silently runs old code. That makes this lane test the installed
          # toolchain rather than the one just built from llvm-patches/, which
          # is precisely what this workflow exists to validate. Pin the loader
          # to the stage, and persist it to the test steps via GITHUB_ENV since
          # chipStar invokes clang again at test time.
          export LD_LIBRARY_PATH="${LLVM_STAGE}/lib:${LLVM_STAGE}/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

          # Fail loudly if the pin did not take effect, rather than silently
          # validating the wrong toolchain again.
          RESOLVED=$(ldd "${LLVM_BIN}/clang" 2>/dev/null | awk '/libclang-cpp/{print $3}')
          case "$RESOLVED" in
            "${LLVM_STAGE}"/*) echo "OK: clang resolves libclang-cpp from the stage" ;;
            "") echo "NOTE: clang does not link libclang-cpp dynamically; nothing to pin" ;;
            *) echo "ERROR: clang resolves libclang-cpp from '$RESOLVED', not the stage"; exit 1 ;;
          esac
          test -f "${LLVM_BIN}/../lib/clang/${{ matrix.llvm-version }}/include/omp.h" \
            || { echo "ERROR: omp.h missing from LLVM install toolchain at ${LLVM_BIN}"; exit 1; }
          cd ${{ github.workspace }}
          rm -rf build-llvm${{ matrix.build-id }}
          mkdir -p build-llvm${{ matrix.build-id }}
          cd build-llvm${{ matrix.build-id }}
          cmake .. -DLLVM_CONFIG_BIN=${LLVM_BIN}/llvm-config -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCHIP_BUILD_SAMPLES=ON -DCHIP_BUILD_TESTS=ON
          ninja all install -j$(nproc)
          ninja build_tests install -j$(nproc)
        timeout-minutes: 60
      - name: Test chipStar with LLVM ${{ matrix.build-id }} (iGPU OpenCL)
        if: always() && steps.build_chipstar.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -f "$HOME/.local/init/bash" ]; then
            export MODULESHOME=$HOME/.local; source "$MODULESHOME/init/bash"
          elif [ -f /etc/profile.d/lmod.sh ]; then source /etc/profile.d/lmod.sh &> /dev/null
          else source /etc/profile.d/modules.sh &> /dev/null; fi
          module use ~/modulefiles
          # IGC 2.36.3/2.38.2 miscompile chipStar kernels under their
          # optimizer (TestSnakeMiscompileO2); this build carries the fix.
          module load igc/all-fixes-2026.07.30
          module load opencl/igpu
          cd ${{ github.workspace }}/build-llvm${{ matrix.build-id }}
          ../scripts/check.py ./ igpu opencl
        timeout-minutes: 60
      - name: Test chipStar with LLVM ${{ matrix.build-id }} (iGPU Level0)
        if: always() && steps.build_chipstar.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -f "$HOME/.local/init/bash" ]; then
            export MODULESHOME=$HOME/.local; source "$MODULESHOME/init/bash"
          elif [ -f /etc/profile.d/lmod.sh ]; then source /etc/profile.d/lmod.sh &> /dev/null
          else source /etc/profile.d/modules.sh &> /dev/null; fi
          module use ~/modulefiles
          # IGC 2.36.3/2.38.2 miscompile chipStar kernels under their
          # optimizer (TestSnakeMiscompileO2); this build carries the fix.
          module load igc/all-fixes-2026.07.30
          module load level-zero/igpu
          cd ${{ github.workspace }}/build-llvm${{ matrix.build-id }}
          ../scripts/check.py ./ igpu level0
        timeout-minutes: 60
      - name: Test chipStar with LLVM ${{ matrix.build-id }} (dGPU Level0)
        if: always() && steps.build_chipstar.outcome == 'success'
        run: |
          if [ -f "$HOME/.local/init/bash" ]; then
            export MODULESHOME=$HOME/.local; source "$MODULESHOME/init/bash"
          elif [ -f /etc/profile.d/lmod.sh ]; then source /etc/profile.d/lmod.sh &> /dev/null
          else source /etc/profile.d/modules.sh &> /dev/null; fi
          module use ~/modulefiles
          # IGC 2.36.3/2.38.2 miscompile chipStar kernels under their
          # optimizer (TestSnakeMiscompileO2); this build carries the fix.
          module load igc/all-fixes-2026.07.30
          module load level-zero/dgpu
          cd ${{ github.workspace }}/build-llvm${{ matrix.build-id }}
          ../scripts/check.py ./ dgpu level0
        timeout-minutes: 60
      - name: Test chipStar with LLVM ${{ matrix.build-id }} (dGPU OpenCL)
        if: always() && steps.build_chipstar.outcome == 'success'
        run: |
          if [ -f "$HOME/.local/init/bash" ]; then
            export MODULESHOME=$HOME/.local; source "$MODULESHOME/init/bash"
          elif [ -f /etc/profile.d/lmod.sh ]; then source /etc/profile.d/lmod.sh &> /dev/null
          else source /etc/profile.d/modules.sh &> /dev/null; fi
          module use ~/modulefiles
          # IGC 2.36.3/2.38.2 miscompile chipStar kernels under their
          # optimizer (TestSnakeMiscompileO2); this build carries the fix.
          module load igc/all-fixes-2026.07.30
          module load opencl/dgpu
          cd ${{ github.workspace }}/build-llvm${{ matrix.build-id }}
          ../scripts/check.py ./ dgpu opencl
        timeout-minutes: 60
      - name: Test chipStar with LLVM ${{ matrix.build-id }} (CPU OpenCL)
        if: always() && steps.build_chipstar.outcome == 'success'
        run: |
          if [ -f "$HOME/.local/init/bash" ]; then
            export MODULESHOME=$HOME/.local; source "$MODULESHOME/init/bash"
          elif [ -f /etc/profile.d/lmod.sh ]; then source /etc/profile.d/lmod.sh &> /dev/null
          else source /etc/profile.d/modules.sh &> /dev/null; fi
          module use ~/modulefiles
          # IGC 2.36.3/2.38.2 miscompile chipStar kernels under their
          # optimizer (TestSnakeMiscompileO2); this build carries the fix.
          module load igc/all-fixes-2026.07.30
          module load opencl/cpu
          cd ${{ github.workspace }}/build-llvm${{ matrix.build-id }}
          ../scripts/check.py ./ cpu opencl --num-tries=3
        timeout-minutes: 60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-llvm${{ matrix.build-id }}
          path: |
            ${{ github.workspace }}/build-llvm${{ matrix.build-id }}/checkpy_*.txt
            ${{ github.workspace }}/build-llvm${{ matrix.build-id }}/Testing/Temporary/LastTest.log

  install-llvm-on-main:
    needs: detect
    # Gated on 'any' (not per-version) because this one job installs all
    # versions; each matrix entry already bails cleanly when its stage is
    # missing, so unchanged versions are a no-op.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.detect.outputs.any == 'true'
    name: Install LLVM ${{ matrix.build-id }} on main branch
    runs-on:
      - self-hosted
      - Linux
      - X64
    strategy:
      matrix:
        include:
          - llvm-version: 21
            build-id: "21"
            install-suffix: ""
            module-name: "21.0"
          - llvm-version: 22
            build-id: "22-translator"
            install-suffix: "-translator"
            module-name: "22.0-translator"
          - llvm-version: 22
            build-id: "22-native"
            install-suffix: "-native"
            module-name: "22.0-native"
          - llvm-version: 23
            build-id: "23"
            install-suffix: ""
            module-name: "23.0"
      fail-fast: false
    steps:
      - name: Install LLVM ${{ matrix.build-id }}
        id: install_llvm
        run: |
          set -euo pipefail
          STAGED="$HOME/llvm-stage/${{ matrix.build-id }}"
          INSTALL_DIR="$HOME/install/llvm/${{ matrix.llvm-version }}.0${{ matrix.install-suffix }}"

          # This job runs on every push to main, but the stage is produced by a
          # *prior* pull_request run of this workflow. If that build failed, was
          # skipped, or the stage was already consumed, there is nothing to
          # install. Bail out before touching the live toolchain: destroying it
          # takes CI down for every PR and can only be undone by a full rebuild.
          if [ ! -d "${STAGED}${INSTALL_DIR}" ]; then
            echo "No staged build at ${STAGED}${INSTALL_DIR}; leaving $INSTALL_DIR untouched."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep the previous toolchain until the new one is in place, so a
          # failure here is recoverable.
          BACKUP="${INSTALL_DIR}.prev"
          rm -rf "$BACKUP"
          if [ -d "$INSTALL_DIR" ]; then
            mv "$INSTALL_DIR" "$BACKUP"
          fi

          if ! mv "${STAGED}${INSTALL_DIR}" "$INSTALL_DIR"; then
            echo "Install failed; restoring previous toolchain."
            rm -rf "$INSTALL_DIR"
            [ -d "$BACKUP" ] && mv "$BACKUP" "$INSTALL_DIR"
            exit 1
          fi
          echo "installed=true" >> "$GITHUB_OUTPUT"
        timeout-minutes: 5
      - name: Verify LLVM ${{ matrix.build-id }} installation
        if: steps.install_llvm.outputs.installed == 'true'
        run: |
          set -euo pipefail
          INSTALL_DIR="$HOME/install/llvm/${{ matrix.llvm-version }}.0${{ matrix.install-suffix }}"
          BACKUP="${INSTALL_DIR}.prev"
          if [ ! -x "$INSTALL_DIR/bin/clang" ]; then
            echo "Installed toolchain has no usable clang; restoring previous."
            rm -rf "$INSTALL_DIR"
            [ -d "$BACKUP" ] && mv "$BACKUP" "$INSTALL_DIR"
            exit 1
          fi
          "$INSTALL_DIR/bin/clang" --version
      - name: Generate modulefile for LLVM ${{ matrix.build-id }}
        if: steps.install_llvm.outputs.installed == 'true'
        run: |
          MODULE_DIR="$HOME/modulefiles/llvm"
          INSTALL_DIR="$HOME/install/llvm/${{ matrix.llvm-version }}.0${{ matrix.install-suffix }}"
          mkdir -p "$MODULE_DIR"
          {
            echo '#%Module'
            echo ''
            echo "set install_dir $INSTALL_DIR"
            echo 'pushenv llvm_PATH $install_dir'
            echo 'pushenv llvm_ROOT $install_dir'
            echo 'pushenv llvm_DIR $install_dir'
            echo 'pushenv LLVM_PATH $install_dir'
            echo 'pushenv LLVM_ROOT $install_dir'
            echo 'pushenv LLVM_DIR $install_dir'
            echo ''
            echo 'prepend-path PATH $install_dir/bin'
            echo 'prepend-path LD_LIBRARY_PATH $install_dir/lib'
            echo 'prepend-path LD_LIBRARY_PATH $install_dir/lib64'
            echo 'prepend-path LIBRARY_PATH $install_dir/lib'
            echo 'prepend-path LIBRARY_PATH $install_dir/lib64'
            echo 'prepend-path CPATH $install_dir/include'
            echo 'prepend-path PKG_CONFIG_PATH $install_dir/lib/pkgconfig'
            echo 'prepend-path CMAKE_PREFIX_PATH $install_dir/lib/cmake'
          } > "$MODULE_DIR/${{ matrix.module-name }}"
          echo "Created modulefile: $MODULE_DIR/${{ matrix.module-name }}"
      # Only reap on success. Reaping unconditionally used to discard the stage
      # even when the install had failed, so the next attempt had nothing to
      # install from.
      - name: Cleanup staged install and backup
        if: success() && steps.install_llvm.outputs.installed == 'true'
        run: |
          rm -rf "$HOME/llvm-stage/${{ matrix.build-id }}"
          rm -rf "$HOME/install/llvm/${{ matrix.llvm-version }}.0${{ matrix.install-suffix }}.prev"

  # macOS (pastrami) and Linux ARM64 (salami) build only the latest LLVM (23);
  # only the x86 Linux runner keeps building every version. LLVM 23 needs a
  # single native build: chipStar patches in llvm#213052, so the SPIRV-target
  # build also serves the translator and the producer is chosen per compilation
  # by -f[no-]integrated-objemitter.
  step1-configure-all-macos:
    needs: detect
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && needs.detect.outputs.run_23 == 'true'
    name: 'Step 1: Configure LLVM 23 (macOS)'
    runs-on: [self-hosted, ARM64, MacOS]
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: 'recursive'
      - name: Configure LLVM 23
        shell: /bin/bash {0}
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          BUILD_DIR="$HOME/llvm-builds/23"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          rm -rf scripts llvm-patches
          cp -r ${{ github.workspace }}/scripts .
          cp -r ${{ github.workspace }}/llvm-patches .
          chmod +x scripts/configure_llvm.sh
          ./scripts/configure_llvm.sh --version 23 \
            --install-dir $HOME/install/llvm/23.0 \
            --variant native --configure-only

  step2-build-test-macos:
    needs: [detect, step1-configure-all-macos]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && needs.detect.outputs.run_23 == 'true'
    name: Build LLVM 23 (macOS) and test chipStar
    runs-on: [self-hosted, ARM64, MacOS]
    env:
      CHIP_DEVICE_TYPE: pocl
      CHIP_MODULE_CACHE_DIR: ""
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: 'recursive'
      - name: Build LLVM 23
        id: build_llvm
        shell: /bin/bash {0}
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          BUILD_DIR="$HOME/llvm-builds/23/llvm-project/llvm/build_23"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory $BUILD_DIR does not exist. Step 1 may have failed."
            exit 1
          fi
          cd "$BUILD_DIR"
          cmake --build . -j$(sysctl -n hw.ncpu)
        timeout-minutes: 300
      - name: Stage install for later
        if: steps.build_llvm.outcome == 'success'
        shell: /bin/bash {0}
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          rm -rf $HOME/llvm-stage/23
          DESTDIR=$HOME/llvm-stage/23 cmake --install $HOME/llvm-builds/23/llvm-project/llvm/build_23
      - name: Test chipStar with LLVM 23 (PoCL OpenCL)
        if: steps.build_llvm.outcome == 'success'
        shell: /bin/bash {0}
        run: |
          source /opt/homebrew/Cellar/modules/5.6.0/init/bash
          export MODULEPATH="/Users/paulius/modulefiles:$MODULEPATH"
          module load pocl

          # Build/test against the INSTALLED LLVM toolchain (staged above), not
          # the build tree, which lacks install-only runtime headers such as
          # omp.h (breaks TestHipccFopenmp with "'omp.h' file not found").
          LLVM_PREFIX="$HOME/install/llvm/23.0"
          LLVM_STAGE="$HOME/llvm-stage/23${LLVM_PREFIX}"
          LLVM_BIN="${LLVM_STAGE}/bin"
          test -f "${LLVM_BIN}/clang" || exit 1
          test -f "${LLVM_BIN}/../lib/clang/23/include/omp.h" \
            || { echo "ERROR: omp.h missing from LLVM install toolchain at ${LLVM_BIN}"; exit 1; }

          # configure_llvm.sh builds with LLVM_LINK_LLVM_DYLIB=ON and
          # CMAKE_INSTALL_RPATH pinned to the final install prefix, so a staged
          # (DESTDIR) clang resolves libclang-cpp/libLLVM from the previously
          # installed toolchain and runs old driver code. Pin the loader to the
          # stage so this lane tests what it just built. DYLD_LIBRARY_PATH (not
          # DYLD_FALLBACK_LIBRARY_PATH) is required: fallback is consulted only
          # after @rpath resolution fails, and here it succeeds with the wrong
          # library. Diagnostic only, not fatal, since the macOS linkage layout
          # is not verified here the way the Linux one is.
          export DYLD_LIBRARY_PATH="${LLVM_STAGE}/lib${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}"
          echo "clang links against:"
          otool -L "${LLVM_BIN}/clang" 2>/dev/null | grep -iE "clang-cpp|libLLVM" || true

          export PATH="/Users/paulius/.pyenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          export CHIP_DEVICE_TYPE=pocl
          export OCL_ICD_VENDORS=/Users/paulius/install/pocl/etc/OpenCL/vendors/
          export SPIRV_TOOLS_PREFIX=$(brew --prefix spirv-tools)
          export CMAKE_PREFIX_PATH="${SPIRV_TOOLS_PREFIX}:${CMAKE_PREFIX_PATH}"

          cd ${{ github.workspace }}
          rm -rf build-23
          mkdir -p build-23
          cd build-23
          /opt/homebrew/bin/cmake .. \
            -DLLVM_CONFIG_BIN=${LLVM_BIN}/llvm-config \
            -DOpenCL_LIBRARY=/Users/paulius/install/pocl/lib/libpocl.dylib \
            -GNinja -DCMAKE_BUILD_TYPE=Debug
          ninja CHIP
          ninja build_tests
          ninja
          ../scripts/check.py ./ pocl opencl
        timeout-minutes: 60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-macos-llvm23
          path: |
            build-23/checkpy_*.txt
            build-23/Testing/Temporary/LastTest.log

  install-llvm-on-main-macos:
    needs: detect
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.detect.outputs.run_23 == 'true'
    name: Install LLVM 23 on main branch (macOS)
    runs-on: [self-hosted, ARM64, MacOS]
    steps:
      - name: Install LLVM 23
        id: install_llvm_macos
        run: |
          set -euo pipefail
          STAGED="$HOME/llvm-stage/23"
          INSTALL_DIR="$HOME/install/llvm/23.0"

          # See the Linux job: the stage comes from a prior pull_request run, so
          # it may not exist. Never delete the live toolchain before we know we
          # have a replacement for it.
          if [ ! -d "${STAGED}${INSTALL_DIR}" ]; then
            echo "No staged build at ${STAGED}${INSTALL_DIR}; leaving $INSTALL_DIR untouched."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BACKUP="${INSTALL_DIR}.prev"
          rm -rf "$BACKUP"
          if [ -d "$INSTALL_DIR" ]; then
            mv "$INSTALL_DIR" "$BACKUP"
          fi

          if ! mv "${STAGED}${INSTALL_DIR}" "$INSTALL_DIR"; then
            echo "Install failed; restoring previous toolchain."
            rm -rf "$INSTALL_DIR"
            [ -d "$BACKUP" ] && mv "$BACKUP" "$INSTALL_DIR"
            exit 1
          fi
          echo "installed=true" >> "$GITHUB_OUTPUT"
        timeout-minutes: 5
      - name: Verify LLVM 23 installation
        if: steps.install_llvm_macos.outputs.installed == 'true'
        run: |
          set -euo pipefail
          INSTALL_DIR="$HOME/install/llvm/23.0"
          BACKUP="${INSTALL_DIR}.prev"
          if [ ! -x "$INSTALL_DIR/bin/clang" ]; then
            echo "Installed toolchain has no usable clang; restoring previous."
            rm -rf "$INSTALL_DIR"
            [ -d "$BACKUP" ] && mv "$BACKUP" "$INSTALL_DIR"
            exit 1
          fi
          "$INSTALL_DIR/bin/clang" --version
      - name: Generate modulefile for LLVM 23
        if: steps.install_llvm_macos.outputs.installed == 'true'
        shell: /bin/bash {0}
        run: |
          MODULE_DIR="$HOME/modulefiles/llvm"
          INSTALL_DIR="$HOME/install/llvm/23.0"
          mkdir -p "$MODULE_DIR"
          {
            echo '#%Module'
            echo ''
            echo "set install_dir $INSTALL_DIR"
            echo 'pushenv llvm_PATH $install_dir'
            echo 'pushenv llvm_ROOT $install_dir'
            echo 'pushenv llvm_DIR $install_dir'
            echo 'pushenv LLVM_PATH $install_dir'
            echo 'pushenv LLVM_ROOT $install_dir'
            echo 'pushenv LLVM_DIR $install_dir'
            echo ''
            echo 'prepend-path PATH $install_dir/bin'
            echo '# Use DYLD_FALLBACK_LIBRARY_PATH instead of DYLD_LIBRARY_PATH'
            echo '# This allows other libraries (like PoCL) to use their @rpath first,'
            echo '# while still providing LLVM libs as a fallback for tools that need them.'
            echo 'prepend-path DYLD_FALLBACK_LIBRARY_PATH $install_dir/lib'
            echo 'prepend-path DYLD_FALLBACK_LIBRARY_PATH $install_dir/lib64'
            echo 'prepend-path LIBRARY_PATH $install_dir/lib'
            echo 'prepend-path LIBRARY_PATH $install_dir/lib64'
            echo 'prepend-path CPATH $install_dir/include'
            echo 'prepend-path PKG_CONFIG_PATH $install_dir/lib/pkgconfig'
            echo 'prepend-path CMAKE_PREFIX_PATH $install_dir/lib/cmake'
          } > "$MODULE_DIR/23.0"
          echo "Created modulefile: $MODULE_DIR/23.0"
      # Only reap on success; see the Linux job.
      - name: Cleanup staged install and backup
        if: success() && steps.install_llvm_macos.outputs.installed == 'true'
        run: |
          rm -rf "$HOME/llvm-stage/23"
          rm -rf "$HOME/install/llvm/23.0.prev"

  # Linux ARM64 (salami) cannot build LLVM itself: an ODROID-N2+ with 6 slow
  # cores and 3.6 GB RAM needs ~15 h for a native LLVM build and most likely
  # runs out of memory at link time. Instead an x86 runner cross-compiles the
  # toolchain in an Ubuntu 22.04 container (whose aarch64 cross compiler
  # targets glibc 2.35 / gcc 11, i.e. salami's exact userland, so no sysroot is
  # needed) and rsyncs the staged install over. See scripts/cross-aarch64/.
  #
  # Prerequisites on the x86 runner, none of them automated here:
  #   1. docker usable without sudo by the runner user;
  #   2. non-interactive ssh access to salami as user pvelesko (runner's public
  #      key in salami's authorized_keys, salami's host key in the runner's
  #      known_hosts, and a `Host salami` block in the runner's ~/.ssh/config);
  #   3. ~40 GB of scratch space somewhere the workspace step can find.
  # All three are already in place on meatloaf and ramen; this is the checklist
  # for any future x86 node, not pending work.
  cross-build-llvm23-aarch64:
    needs: detect
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && needs.detect.outputs.run_23 == 'true'
    name: 'Cross-build LLVM 23 for salami (aarch64)'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # No submodules: the cross build only reads scripts/ and
          # llvm-patches/.
      - name: Pick a scratch workspace with room for the build
        run: |
          set -euo pipefail
          # A completed build measures ~12 GB (sources + build tree + stage);
          # 40 is the threshold with headroom. Where that fits differs per
          # node: ramen's / has ~48 GB free and a history of filling up but
          # carries a separate 3.6 TB /space, while meatloaf has no separate
          # /space and ~76 GB on /. So resolve the location at runtime instead
          # of hardcoding $HOME or runner.temp, and refuse to start rather than
          # dying mid-link with ENOSPC.
          NEED_GB=40
          USER_NAME="$(id -un)"
          PICK=""
          for CAND in "/space/$USER_NAME/llvm-cross-build" \
                      "$HOME/llvm-cross-aarch64" \
                      "${RUNNER_TEMP:-/tmp}/llvm-cross-aarch64"; do
            [ -d "$(dirname "$CAND")" ] || continue
            mkdir -p "$CAND" 2>/dev/null || continue
            AVAIL=$(df -BG --output=avail "$CAND" | tail -1 | tr -dc '0-9')
            echo "candidate $CAND: ${AVAIL:-0} GB free"
            if [ "${AVAIL:-0}" -ge "$NEED_GB" ]; then PICK="$CAND"; break; fi
          done
          if [ -z "$PICK" ]; then
            echo "ERROR: no candidate workspace has ${NEED_GB} GB free."
            echo "Free space on this runner, or add a large scratch filesystem."
            df -h
            exit 1
          fi
          echo "Using cross-build workspace: $PICK"
          echo "CROSS_WORK=$PICK" >> "$GITHUB_ENV"
      - name: Build the cross-compilation container
        run: |
          docker build -t chipstar-llvm-cross-aarch64 \
            ${{ github.workspace }}/scripts/cross-aarch64
        timeout-minutes: 30
      - name: Cross-build LLVM 23 for aarch64
        run: |
          set -euo pipefail
          # Leave one core for the runner itself; the x86 nodes differ (8 on
          # meatloaf, 16 on ramen), so size this from nproc, never pinned.
          JOBS=$(nproc); JOBS=$(( JOBS > 1 ? JOBS - 1 : 1 ))
          # Run as the runner user so the staged tree stays rsync-able and
          # removable without root; /work persists so rebuilds are incremental.
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/work \
            -v "${{ github.workspace }}":/chipstar:ro \
            -v "$CROSS_WORK":/work \
            chipstar-llvm-cross-aarch64 \
            /chipstar/scripts/cross-aarch64/cross-build.sh "$JOBS"
        # ~29 min at -j26 on a 32-core box; 8-16 core nodes take a few hours.
        timeout-minutes: 420
      - name: Ship the toolchain to salami
        run: |
          set -euo pipefail
          STAGE="$CROSS_WORK/stage/home/pvelesko/install/llvm/23.0"
          test -x "$STAGE/bin/clang"
          # Installed straight to the final prefix rather than staged and
          # promoted on main like the x86/macOS lanes: CMAKE_INSTALL_RPATH is
          # baked to this path, so running from anywhere else needs
          # LD_LIBRARY_PATH gymnastics. No other salami lane uses llvm/23.0
          # today (check-unit-tests-arm.yml is on llvm-21), so a PR's toolchain
          # landing here cannot break another job.
          ssh salami 'mkdir -p ~/install/llvm/23.0 ~/modulefiles/llvm'
          rsync -a --delete "$STAGE/" salami:install/llvm/23.0/
          # Modulefile mirrors the one the x86 install-on-main job generates.
          # The prefix is literal because it is also baked into the binaries'
          # RPATH by the cross build.
          INSTALL_DIR="/home/pvelesko/install/llvm/23.0"
          {
            echo '#%Module'
            echo ''
            echo "set install_dir $INSTALL_DIR"
            echo 'pushenv llvm_PATH $install_dir'
            echo 'pushenv llvm_ROOT $install_dir'
            echo 'pushenv llvm_DIR $install_dir'
            echo 'pushenv LLVM_PATH $install_dir'
            echo 'pushenv LLVM_ROOT $install_dir'
            echo 'pushenv LLVM_DIR $install_dir'
            echo ''
            echo 'prepend-path PATH $install_dir/bin'
            echo 'prepend-path LD_LIBRARY_PATH $install_dir/lib'
            echo 'prepend-path LD_LIBRARY_PATH $install_dir/lib64'
            echo 'prepend-path LIBRARY_PATH $install_dir/lib'
            echo 'prepend-path LIBRARY_PATH $install_dir/lib64'
            echo 'prepend-path CPATH $install_dir/include'
            echo 'prepend-path PKG_CONFIG_PATH $install_dir/lib/pkgconfig'
            echo 'prepend-path CMAKE_PREFIX_PATH $install_dir/lib/cmake'
          } > "$RUNNER_TEMP/llvm-23.0.modulefile"
          scp "$RUNNER_TEMP/llvm-23.0.modulefile" salami:modulefiles/llvm/23.0
          # Smoke test: proves the cross-built binaries actually run on salami
          # and resolve their RPATH'd libraries there.
          ssh salami "$INSTALL_DIR/bin/clang --version"
        timeout-minutes: 60

  step2-build-test-salami:
    needs: [detect, cross-build-llvm23-aarch64]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && needs.detect.outputs.run_23 == 'true'
    name: Test chipStar on salami with cross-built LLVM 23
    runs-on: [self-hosted, Linux, ARM64]
    env:
      CHIP_LOGLEVEL: err
      CHIP_MODULE_CACHE_DIR: ""
      POCL_KERNEL_CACHE: 0
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: 'recursive'
      - name: Build chipStar with LLVM 23
        id: build_chipstar
        run: |
          # No `set -e` here, matching the other lanes in this workflow: the
          # Environment Modules shell functions do not survive `set -u`.
          if [ -f "$HOME/.local/init/bash" ]; then
            export MODULESHOME=$HOME/.local; source "$MODULESHOME/init/bash"
          elif [ -f /etc/profile.d/lmod.sh ]; then source /etc/profile.d/lmod.sh &> /dev/null
          else source /etc/profile.d/modules.sh &> /dev/null; fi
          module use ~/modulefiles
          module load llvm/23.0
          cd ${{ github.workspace }}
          rm -rf build-23
          mkdir -p build-23
          cd build-23
          # Native SPIR-V backend (LLVM 23 carries llvm#213052), Mali-G52
          # workarounds, and no fp64: the Mali blob has no double support.
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_CONFIG_BIN=$HOME/install/llvm/23.0/bin/llvm-config \
            -DCHIP_LLVM_USE_INTERGRATED_SPIRV=ON \
            -DCHIP_MALI_GPU_WORKAROUNDS=ON \
            -DCHIP_SKIP_TESTS_WITH_DOUBLES=ON \
            -DCHIP_BUILD_SAMPLES=ON -DCHIP_BUILD_TESTS=ON
          # -j4, not nproc: salami has 3.6 GB RAM and OOMs at higher
          # parallelism.
          ninja all install -j4
          ninja build_tests install -j4
        timeout-minutes: 300
      - name: Test chipStar with LLVM 23 (iGPU OpenCL)
        if: steps.build_chipstar.outcome == 'success'
        run: |
          if [ -f "$HOME/.local/init/bash" ]; then
            export MODULESHOME=$HOME/.local; source "$MODULESHOME/init/bash"
          elif [ -f /etc/profile.d/lmod.sh ]; then source /etc/profile.d/lmod.sh &> /dev/null
          else source /etc/profile.d/modules.sh &> /dev/null; fi
          module use ~/modulefiles
          module load llvm/23.0
          cd ${{ github.workspace }}/build-23
          ../scripts/check.py ./ igpu opencl
        timeout-minutes: 180
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-salami-llvm23
          path: |
            ${{ github.workspace }}/build-23/checkpy_*.txt
            ${{ github.workspace }}/build-23/Testing/Temporary/LastTest.log
