name: Reap CI scratch

# The self-hosted lanes leave one scratch tree per pull request behind: salami's
# ~/ci-stage/pr-<N>-<variant> (about 1 GB), the cross builder's
# cross-chipstar-work/{src,native,cross}-pr-<N>-<variant> (about 2.5 GB
# per variant), and the library presubmit's
# /tmp/chipstar-ci-staging-salami/<pr>. A closed pull request will never be
# tested again, so its trees are dead the moment it closes and this workflow
# deletes exactly those.
#
# It replaces the reap that used to sit at the end of the Mali test job and
# matched only trees older than a week: those disks fill in days, so nothing
# was ever old enough to collect and the builder reached 100 percent with
# 179 GB of trees while salami failed an rsync at 7 MB free (issue #1472).

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  # A producer still queued at close ships after the close-time reap; sweep every closed PR.
  schedule:
    - cron: '23 */6 * * *'

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  resolve:
    name: resolve the closed pull request
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.resolve.outputs.prs }}
    steps:
      # A push carries no pull request number of its own, so walk from the
      # pushed commits back to the pull requests they closed. Both triggers
      # are kept: an abandoned pull request never reaches main at all.
      - id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const prs = new Set();
            if (context.eventName === 'schedule') {
              const closed = await github.paginate(github.rest.pulls.list,
                {owner, repo, state: 'closed', per_page: 100});
              for (const pr of closed) prs.add(String(pr.number));
            } else if (context.payload.pull_request) {
              const number = context.payload.pull_request.number;
              prs.add(String(number));
              // Cancel and drain this PR's runs so no producer ships a tree after the reap.
              const shas = new Set((await github.paginate(github.rest.pulls.listCommits,
                {owner, repo, pull_number: number, per_page: 100})).map(c => c.sha));
              const mine = [];
              for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                  {owner, repo, status, per_page: 100});
                for (const r of runs) {
                  if (r.id === context.runId || r.event === 'push' || r.event === 'schedule') continue;
                  if (r.pull_requests.some(p => p.number === number) || shas.has(r.head_sha)) mine.push(r.id);
                }
              }
              for (const run_id of mine) {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id}).catch(e => core.warning(`cancel ${run_id}: ${e.message}`));
              }
              const deadline = Date.now() + 10 * 60 * 1000;
              let live = mine;
              while (live.length && Date.now() < deadline) {
                await new Promise(r => setTimeout(r, 15000));
                const st = await Promise.all(live.map(run_id =>
                  github.rest.actions.getWorkflowRun({owner, repo, run_id}).then(r => r.data.status)));
                live = live.filter((_, i) => st[i] !== 'completed');
              }
              core.info(`cancelled ${mine.length} runs, ${live.length} still live: ${live.join(' ')}`);
            } else {
              const pushed = new Set((context.payload.commits || []).map(c => c.id));
              if (context.sha) pushed.add(context.sha);
              for (const commit_sha of pushed) {
                const {data} = await github.rest.repos.listPullRequestsAssociatedWithCommit(
                  {owner, repo, commit_sha});
                for (const pr of data) if (pr.merged_at) prs.add(String(pr.number));
              }
            }
            core.info(`closed PRs: ${[...prs].join(' ') || 'none'}`);
            core.setOutput('prs', [...prs].join(' '));

  cross-builder:
    name: reap cross build trees
    needs: resolve
    if: needs.resolve.outputs.prs != ''
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reap
        env:
          PRS: ${{ needs.resolve.outputs.prs }}
        run: |
          set -euo pipefail
          W=/space/pvelesko/cross-chipstar-work
          [ -d /space ] || W=$HOME/cross-chipstar-work
          scripts/ci/reap-merged-dirs.sh -d "$W" \
            -p 'src-pr-%s-*' -p 'native-pr-%s-*' -p 'cross-pr-%s-*' $PRS

  salami:
    name: reap stage trees
    needs: resolve
    if: needs.resolve.outputs.prs != ''
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reap
        env:
          PRS: ${{ needs.resolve.outputs.prs }}
        run: |
          set -euo pipefail
          scripts/ci/reap-merged-dirs.sh -d "$HOME/ci-stage" -p 'pr-%s-*' $PRS
          # The library presubmit stages under the pull request number instead.
          scripts/ci/reap-merged-dirs.sh -d /tmp/chipstar-ci-staging-salami -p '%s' $PRS
