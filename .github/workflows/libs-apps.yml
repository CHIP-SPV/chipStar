name: Libraries and apps (Intel dGPU)

# chipStar plus every downstream library with its tests, and the zeroRK and
# OpenSn checks, on an Intel discrete GPU under Level Zero and OpenCL. Run it
# from the Actions tab, or comment /check-apps on a pull request to get a
# check-apps status on its head commit.
#
# Runner needs: modules oneapi/2025.0.4 and llvm/23.0, kernel journal access
# (adm group), clinfo, fuser, OpenMPI, gfortran, and on Ubuntu libgtest-dev
# libgmock-dev libblas-dev liblapack-dev libboost-dev pybind11-dev.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to test (overrides ref)
        required: false
      ref:
        description: Branch, tag or sha to test, by default the dispatched branch
        required: false
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  libs-apps:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/check-apps') &&
       contains(fromJSON('["colleeneb", "pvelesko"]'), github.event.comment.user.login))
    runs-on: [self-hosted, intel-dgpu]
    timeout-minutes: 1440
    concurrency:
      group: libs-apps
    env:
      PR: ${{ github.event.issue.number || inputs.pr }}
      REF: ${{ inputs.ref }}
    steps:
      - name: Resolve the commit to test
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const pr = process.env.PR;
            if (!pr) return core.setOutput('sha', process.env.REF || context.sha);
            const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(pr) });
            core.setOutput('sha', data.head.sha);
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: data.head.sha, state: 'pending', context: 'check-apps',
              description: 'libraries and apps running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (context.eventName === 'issue_comment')
              await github.rest.reactions.createForIssueComment({
                ...context.repo, comment_id: context.payload.comment.id, content: 'rocket',
              });
      # The script comes from the default or dispatched branch, so it can test PRs older than it.
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: src
          fetch-depth: 0
          submodules: recursive
      # The job owns the machine; the script's load-based default would shrink by the previous job's load.
      - name: Build and test
        run: |
          jobs=$(awk -v n="$(nproc)" '/^MemTotal/ { j = int($2 / 3145728); if (n - 1 < j) j = n - 1; print (j < 1 ? 1 : j) }' /proc/meminfo)
          ci/scripts/ci/libs-apps.sh -s src -w "${{ runner.temp }}/libs-apps" -j "$jobs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libs-apps-logs
          path: |
            ${{ runner.temp }}/libs-apps/summary.txt
            ${{ runner.temp }}/libs-apps/logs
      - name: Report check-apps
        if: always() && env.PR && steps.target.outputs.sha
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: '${{ steps.target.outputs.sha }}', state: ok ? 'success' : 'failure',
              context: 'check-apps', description: ok ? 'libraries and apps pass' : 'see summary.txt in the run artifacts',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
