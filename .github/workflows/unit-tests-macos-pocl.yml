name: Unit tests (macOS PoCL)
run-name: ${{ inputs.math_tests && 'Math tests' || '' }}

# pastrami: Apple Silicon, OpenCL only via PoCL (no Level Zero). Both SPIR-V
# producers are built from the same LLVM 23 toolchain.
#
# Sequential lanes rather than a matrix: there is one runner and the lanes share
# BUILD_ROOT.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: "docs/**"
  workflow_dispatch:
    inputs:
      math_tests:
        description: Run only the hip-tests MathsTest cases
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ !github.event.pull_request.draft }}
    name: chipStar unit tests (LLVM 23, native + translator)
    runs-on: [self-hosted, ARM64, MacOS]
    env:
      CHIP_MODULE_CACHE_DIR: ""
      # Build dirs persist across jobs so ninja rebuilds only what changed.
      BUILD_ROOT: /Users/paulius/ci-build
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup environment
        shell: /bin/bash {0}
        run: |
          export PATH="/Users/paulius/.pyenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          source /opt/homebrew/Cellar/modules/5.6.0/init/bash
          export MODULEPATH="/Users/paulius/modulefiles:$MODULEPATH"
          module load ocl-icd-loader
          module load pocl

          export LLVM_DIR=$HOME/install/llvm/23.0
          export LLVM_LIBDIR=$($LLVM_DIR/bin/llvm-config --libdir)
          export CHIP_DEVICE_TYPE=pocl
          export OCL_ICD_VENDORS=/Users/paulius/install/pocl/etc/OpenCL/vendors/

          # Add SPIRV-Tools from homebrew to CMAKE_PREFIX_PATH
          export SPIRV_TOOLS_PREFIX=$(brew --prefix spirv-tools)
          export CMAKE_PREFIX_PATH="${SPIRV_TOOLS_PREFIX}:${CMAKE_PREFIX_PATH}"

          # Every test compiles device code with clang, and upstream clang has
          # no built-in macOS sysroot, so without this the driver cannot find
          # libSystem and every test fails to link.
          export SDKROOT=$(xcrun --show-sdk-path)

          # Patch PoCL rpaths if not already done. Globbed rather than spelled
          # out, so that rebuilding PoCL at a new version does not silently
          # leave its library unpatched.
          for lib in /Users/paulius/install/pocl/lib/libpocl.*.dylib; do
            if [ -f "$lib" ]; then
              otool -l "$lib" | grep -q "path ${LLVM_LIBDIR}" || install_name_tool -add_rpath "${LLVM_LIBDIR}" "$lib" || true
            fi
          done

          for v in PATH LLVM_DIR LLVM_LIBDIR CHIP_DEVICE_TYPE OCL_ICD_VENDORS \
                   CMAKE_PREFIX_PATH PKG_CONFIG_PATH LIBRARY_PATH SDKROOT; do
            echo "$v=${!v}" >> $GITHUB_ENV
          done

      # ninja cannot see a rebuilt toolchain, a new file shadowing an included one, nor a
      # changed CMake default, which only seeds a fresh cache; any change wipes both lanes.
      - name: Reset build dirs on configuration change
        shell: /bin/bash {0}
        run: |
          set -eo pipefail
          STAMP=$(set -eo pipefail; { find -L $LLVM_DIR/bin $LLVM_DIR/lib -maxdepth 1 -type f -exec stat -f '%N %m' {} + | sort; cat .github/workflows/unit-tests-macos-pocl.yml
            git ls-files --recurse-submodules | grep -vE '\.(c|cc|cpp|cxx|hip|cu|md|rst)$'
            git ls-files -z --recurse-submodules -- '*CMakeLists.txt' '*.cmake' | xargs -0 cat; } | shasum -a 256)
          [ "$(cat $BUILD_ROOT/stamp 2>/dev/null)" = "$STAMP" ] || rm -rf $BUILD_ROOT
          mkdir -p $BUILD_ROOT && echo "$STAMP" > $BUILD_ROOT/stamp

      # =====================================================================
      # Lane 1: in-tree SPIR-V backend
      # =====================================================================
      - name: Build chipStar (native SPIR-V backend)
        shell: /bin/bash {0}
        run: |
          set -e
          B=$BUILD_ROOT/native
          rm -f $B/checkpy_*.txt $B/Testing/Temporary/LastTest.log
          cmake -S . -B $B -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_LINK_DEPENDS_NO_SHARED=ON \
            -DCHIP_LLVM_USE_INTERGRATED_SPIRV=ON \
            -DCHIP_ATOMICS_CACHE_BYPASS_WORKAROUND=ON \
            -DCHIP_BUILD_SAMPLES=ON -DCHIP_BUILD_TESTS=ON \
            -DLLVM_CONFIG_BIN=$LLVM_DIR/bin/llvm-config \
            -DOpenCL_LIBRARY=/Users/paulius/install/ocl-icd-loader/lib/libOpenCL.dylib \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install-native
          ninja -C $B -j$(sysctl -n hw.ncpu)
          ninja -C $B -j$(sysctl -n hw.ncpu) build_tests
          cmake --install $B

      - name: Test install (native)
        shell: /bin/bash {0}
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/install-native/bin:$PATH"
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/install-native/lib:$DYLD_LIBRARY_PATH"
          which hipcc && hipcc --version
          TEST_DIR=${{ runner.temp }}/install_test
          mkdir -p ${TEST_DIR}
          cat > ${TEST_DIR}/test_install.cpp << 'EOF'
          #include <hip/hip_runtime.h>
          #include <iostream>
          __global__ void emptyKernel() {}
          int main() {
              emptyKernel<<<1,1>>>();
              hipError_t err = hipDeviceSynchronize();
              std::cout << "Install test: " << (err == hipSuccess ? "PASSED" : "FAILED") << std::endl;
              return err == hipSuccess ? 0 : 1;
          }
          EOF
          hipcc ${TEST_DIR}/test_install.cpp -o ${TEST_DIR}/test_install
          ${TEST_DIR}/test_install

      - name: Test native, pocl opencl
        shell: /bin/bash {0}
        run: |
          set -e
          cd $BUILD_ROOT/native && $GITHUB_WORKSPACE/scripts/check.py ./ pocl opencl ${{ inputs.math_tests && '--math-tests' || '' }}
        timeout-minutes: 60

      # =====================================================================
      # Lane 2: llvm-spirv translator
      # =====================================================================
      - name: Build chipStar (llvm-spirv translator)
        if: ${{ !cancelled() && (success() || inputs.math_tests) }}
        shell: /bin/bash {0}
        run: |
          set -e
          B=$BUILD_ROOT/translator
          rm -f $B/checkpy_*.txt $B/Testing/Temporary/LastTest.log
          cmake -S . -B $B -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_LINK_DEPENDS_NO_SHARED=ON \
            -DCHIP_LLVM_USE_INTERGRATED_SPIRV=OFF \
            -DCHIP_ATOMICS_CACHE_BYPASS_WORKAROUND=ON \
            -DCHIP_BUILD_SAMPLES=ON -DCHIP_BUILD_TESTS=ON \
            -DLLVM_CONFIG_BIN=$LLVM_DIR/bin/llvm-config \
            -DOpenCL_LIBRARY=/Users/paulius/install/ocl-icd-loader/lib/libOpenCL.dylib
          ninja -C $B -j$(sysctl -n hw.ncpu)
          ninja -C $B -j$(sysctl -n hw.ncpu) build_tests

      - name: Test translator, pocl opencl
        if: ${{ !cancelled() && (success() || inputs.math_tests) }}
        shell: /bin/bash {0}
        run: |
          set -e
          cd $BUILD_ROOT/translator && $GITHUB_WORKSPACE/scripts/check.py ./ pocl opencl ${{ inputs.math_tests && '--math-tests' || '' }}
        timeout-minutes: 60

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-macos-llvm23
          path: |
            /Users/paulius/ci-build/*/checkpy_*.txt
            /Users/paulius/ci-build/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  math-tests-status:
    needs: build-and-test
    if: ${{ always() && inputs.math_tests }}
    permissions:
      actions: read
      statuses: write
    uses: ./.github/workflows/math-tests-status.yml
    with:
      result: ${{ needs.build-and-test.result }}
