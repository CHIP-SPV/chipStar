# Workflow syntax:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
name: cpp-linter

on:
  push:
    paths-ignore: "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpp-linter:
    runs-on: ubuntu-latest
    container:
      image: pveleskopglc/chipstar:cpp-linter
      options: --user chipStarUser
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Run C/C++ Linter
        env:
          # --files-changed-only makes cpp-linter ask the API which lines the
          # commit touched. Unauthenticated it shares the 60/hour anonymous
          # budget for the whole runner IP, which other jobs routinely exhaust:
          #   response returned 403 from GET .../commits/<sha>
          #   API rate limit exceeded for 52.150.29.102.
          # cpp_linter/rest_api/github_api.py sends this as an Authorization
          # header when set, moving the request onto the repo's own budget.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ml StdEnv
          . /home/chipStarUser/venv/bin/activate

          touch `pwd`/include/chipStarConfig.hh
          export CPATH=`pwd`/include/:$CPATH
          export CPATH=`pwd`/HIP/include/:$CPATH
          export CPATH=`pwd`/spirv-extractor/SPIRV-Tools/include/:$CPATH
          echo "CPATH=$CPATH" >> $GITHUB_ENV

          echo "$CPATH"
          echo "$LD_LIBRARY_PATH"
          echo "$LIBRARY_PATH"
          echo "$PATH"

          cpp-linter \
            --style="file" \
            --extensions=cc,hh \
            --tidy-checks="-*,readability-*,modernize-*,clang-analyzer-*" \
            --repo-root=. \
            --version=15 \
            --verbosity=info \
            --lines-changed-only="true" \
            --files-changed-only="true" \
            --thread-comments="false" \
            --no-lgtm=true \
            --step-summary="false" \
            --ignore=".github" \
            --database= \
            --file-annotations=true \
            --extra-arg="-std=c++17" \
            --tidy-review="false" \
            --format-review="false"

          if [ $? -ne 0 ]; then
            exit 1
          fi
        shell: bash
